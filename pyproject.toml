[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "what2eat-today"
version = "0.1.0"
description = "带偏好权重、工作日防重复规则和月历的午餐选择器"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
build = ["pyinstaller>=6,<7"]

[project.gui-scripts]
what2eat = "what2eat.app:main"

[tool.setuptools.packages.find]
include = ["what2eat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
